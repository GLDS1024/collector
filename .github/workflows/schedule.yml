name: Execute On Schedule

on:
  schedule:
    - cron: "30 * * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Contents
        uses: actions/checkout@master

      - name: Setup Python
        uses: actions/setup-python@master
        with:
          python-version: "3.12"

      - name: Install Python Packages Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Python Script
        run: python main.py

      - name: Commit Files
        run: |
          git checkout --orphan latest_branch
          git config --local user.email "ggllddss2022@gmail.com"
          git config --local user.name "glds1024"
          git add -A
          git commit -am "Updated $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M %Z')"
          git branch -D main
          git branch -m main
          git push -f origin main

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          branch: main
